<form method="get" class="flex flex-wrap items-end gap-3 mb-6">
  <label class="flex flex-col text-sm gap-1">Du
    <input type="date" name="debut" value="{{ debut|date:'Y-m-d' }}" class="border border-base-200 rounded-default px-3 py-2 bg-white dark:bg-base-900 dark:border-base-700">
  </label>
  <label class="flex flex-col text-sm gap-1">Au
    <input type="date" name="fin" value="{{ fin|date:'Y-m-d' }}" class="border border-base-200 rounded-default px-3 py-2 bg-white dark:bg-base-900 dark:border-base-700">
  </label>
  <button type="submit" class="bg-primary-600 text-white font-medium px-3 py-2 rounded-default">Afficher</button>
</form>
